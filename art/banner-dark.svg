<svg xmlns="http://www.w3.org/2000/svg" aria-labelledby="title desc" role="img" viewBox="0 0 800 200"><title id="title">Signal Rain</title><desc id="desc">Animated digital-rain screensaver with no ads, analytics, or tracking.</desc><defs><linearGradient id="sky" x2="0" y2="1"><stop stop-color="#101b37"/><stop offset="1" stop-color="#030711"/></linearGradient><radialGradient id="glow"><stop stop-color="#5876ba" stop-opacity=".35"/><stop offset="1" stop-color="#111827" stop-opacity="0"/></radialGradient></defs><rect width="800" height="200" fill="#0c0a09" stroke="#1c1917" rx="16"/><text x="42" y="79" fill="#fff" font-family="system-ui,-apple-system,'Segoe UI',sans-serif" font-size="40" font-weight="700" letter-spacing="-.5">Signal Rain</text><text x="42" y="108" fill="#a8a29e" font-family="system-ui,-apple-system,'Segoe UI',sans-serif" font-size="14">Continuous motion, no ads, analytics, or tracking</text><g font-family="system-ui,-apple-system,'Segoe UI',sans-serif" font-size="10" font-weight="500" text-anchor="middle"><rect width="90" height="22" x="42" y="128" fill="#1a1a1a" stroke="#60a5fa" stroke-width=".8" opacity=".8" rx="11"/><text x="87" y="143" fill="#60a5fa">Animated</text><rect width="88" height="22" x="142" y="128" fill="#1a1a1a" stroke="#a78bfa" stroke-width=".8" opacity=".8" rx="11"/><text x="186" y="143" fill="#a78bfa">Adjustable</text><rect width="74" height="22" x="240" y="128" fill="#1a1a1a" stroke="#4ade80" stroke-width=".8" opacity=".8" rx="11"/><text x="277" y="143" fill="#4ade80">Offline</text></g><g transform="translate(565 32)"><rect width="200" height="140" rx="12" fill="#02100a"/><g stroke="#4ade80" stroke-width="3" stroke-linecap="square"><path d="M20 15v45m0 10v15m30-60v60m0 12v18m30-76v70m0 10v14m30-100v60m0 10v25m30-90v45m0 10v30m30-50v45"/><path d="M16 30h8m-8 20h8m24-8h8m22 16h8m24-6h8m22 2h8m22 20h8"/></g></g></svg>